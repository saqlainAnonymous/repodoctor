[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repodoctor-cli"
version = "0.1.0"
description = "Evidence-based repository health and security auditor"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Saqlain Shah"}]
dependencies = []

[project.scripts]
repodoctor = "repodoctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repodoctor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
